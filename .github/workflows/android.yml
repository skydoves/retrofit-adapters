name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Spotless check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: spotless
        run: ./gradlew spotlessCheck

  api_check:
    name: API check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: API check
        run: ./gradlew apiCheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build
